---
# TEMPORARY WIP workflow to validate native windows arm64 minion MSI
# builds end to end, without needing to run Salt's full CI pipeline
# (prepare-workflow, docs, release-patch, etc). Not for upstream PR.
# Delete before opening any real pull request.
name: Test ARM64 MSI (WIP)

on:
  workflow_dispatch: {}

env:
  COLUMNS: 190
  PIP_INDEX_URL: https://pypi.org/simple

jobs:

  prepare:
    name: Prepare
    runs-on: ubuntu-22.04
    outputs:
      salt-version: ${{ steps.setup-salt-version.outputs.salt-version }}
      matrix: '{"linux":[],"macos":[],"windows":[{"arch":"arm64"}]}'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Setup Python Tools Scripts
        uses: ./.github/actions/setup-python-tools-scripts
        with:
          cache-prefix: test-arm64-msi

      - name: Setup Salt Version
        id: setup-salt-version
        uses: ./.github/actions/setup-salt-version

  build-source-tarball:
    name: Build Source Tarball
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Setup Python Tools Scripts
        uses: ./.github/actions/setup-python-tools-scripts
        with:
          cache-prefix: test-arm64-msi

      - name: Stub Man Pages
        # setup.py's install_data step copies these into the wheel; a
        # real build gets them from build-docs (Sphinx), which this
        # harness skips entirely. Same stub install_salt.ps1 itself
        # already creates for non-source-tarball local dev builds.
        run: |
          mkdir -p doc/man
          touch doc/man/salt-call.1 doc/man/salt-cp.1 doc/man/salt-minion.1

      - name: Create Source Tarball
        env:
          SALT_VERSION: "${{ needs.prepare.outputs.salt-version }}"
        run: |
          echo "${{ needs.prepare.outputs.salt-version }}" > salt/_version.txt
          tools pkg source-tarball

      - name: Create Hash Files
        run: |
          tools pkg generate-hashes dist/salt-${{ needs.prepare.outputs.salt-version }}.tar.gz

      - name: Upload Source Tarball as an Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: salt-${{ needs.prepare.outputs.salt-version }}.tar.gz
          path: dist/salt-*.tar.gz*
          retention-days: 1
          if-no-files-found: error

  fake-man-pages:
    # Real man pages need a Sphinx docs build. Nothing about the arm64
    # build mechanics touches man pages, so stub an empty archive under
    # the artifact name build-packages.yml expects rather than building
    # real docs just for this feasibility test.
    name: Fake Man Pages
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - name: Create Empty Man Pages Archive
        run: |
          mkdir -p doc/man
          touch doc/man/.keep
          tar -cJf man-pages-${{ needs.prepare.outputs.salt-version }}.tar.xz -C doc man

      - name: Upload Man Pages as an Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: man-pages-${{ needs.prepare.outputs.salt-version }}
          path: man-pages-*.tar.xz
          retention-days: 1
          if-no-files-found: error

  build-salt-onedir:
    name: Build Salt Onedir
    needs:
      - prepare
      - build-source-tarball
    uses: ./.github/workflows/build-salt-onedir.yml
    with:
      cache-seed: test-arm64-msi
      salt-version: "${{ needs.prepare.outputs.salt-version }}"
      relenv-version: "0.22.14"
      python-version: "3.14.6"
      ci-python-version: "3.14"
      matrix: ${{ needs.prepare.outputs.matrix }}
      linux_arm_runner: "ubuntu-24.04-arm"

  build-pkgs-onedir:
    name: Build Windows Packages
    needs:
      - prepare
      - build-salt-onedir
      - fake-man-pages
    uses: ./.github/workflows/build-packages.yml
    with:
      salt-version: "${{ needs.prepare.outputs.salt-version }}"
      cache-prefix: test-arm64-msi
      relenv-version: "0.22.14"
      python-version: "3.14.6"
      ci-python-version: "3.14"
      source: "onedir"
      matrix: ${{ needs.prepare.outputs.matrix }}
      linux_arm_runner: "ubuntu-24.04-arm"
